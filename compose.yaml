services:
  finance-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wife_finance_test
      POSTGRES_USER: wife_test
      POSTGRES_PASSWORD: wife_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wife_test -d wife_finance_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
