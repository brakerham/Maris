[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wife-system"
version = "0.1.0"
description = "A minimal, testable personal-finance agent core."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8,<10",
]

[project.scripts]
wife-agent = "wife_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
